<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scale Trainer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" x-data="trainer" x-cloak>
    <header class="topbar">
      <h1>Scale Trainer</h1>
      <div class="segmented mode-switch" role="group" aria-label="Modalità">
        <button :class="{ active: mode === 'explore' }" @click="setMode('explore')">Esplora</button>
        <button :class="{ active: mode === 'exercise' }" @click="setMode('exercise')">Esercizi</button>
      </div>
      <div class="segmented" role="group" aria-label="Nomi delle note">
        <button :class="{ active: lang === 'it' }" @click="lang = 'it'">Do Re Mi</button>
        <button :class="{ active: lang === 'en' }" @click="lang = 'en'">C D E</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" x-show="mode === 'explore'">
        <nav class="type-tabs" aria-label="Tipo di scala">
          <template x-for="id in typeIds" :key="id">
            <button :class="{ active: type === id }" @click="setType(id)" x-text="SCALE_TYPES[id].label"></button>
          </template>
        </nav>
        <ul class="tonic-list">
          <template x-for="t in tonicList" :key="t.id">
            <li>
              <button :class="{ active: tonic === t.id }" @click="setTonic(t.id)">
                <span x-text="t.name"></span>
                <span class="sig" x-text="t.signature"></span>
              </button>
            </li>
          </template>
        </ul>
      </aside>

      <aside class="sidebar" x-show="mode === 'exercise'">
        <nav class="type-tabs" aria-label="Esercizio">
          <template x-for="(ex, id) in EXERCISES" :key="id">
            <button :class="{ active: exercise === id }" @click="setExercise(id)" x-text="ex.label"></button>
          </template>
        </nav>
        <div class="options">
          <fieldset>
            <legend>Accordi</legend>
            <label><input type="checkbox" x-model="opts.triads" :disabled="!opts.sevenths"> Triadi</label>
            <label><input type="checkbox" x-model="opts.sevenths" :disabled="!opts.triads"> Quadriadi</label>
          </fieldset>
          <fieldset>
            <legend>Rivolti</legend>
            <label>
              <input type="checkbox" x-model="opts.inversions">
              <span x-text="EXERCISES[exercise].midi ? 'Chiedi un rivolto preciso' : 'Mostra anche i rivolti'"></span>
            </label>
          </fieldset>
          <fieldset x-show="exercise === 'nameChord'">
            <legend>Rispondi con</legend>
            <label><input type="radio" value="name" x-model="opts.answer"> Nome dell'accordo</label>
            <label><input type="radio" value="degree" x-model="opts.answer"> Grado</label>
          </fieldset>
          <fieldset>
            <legend>Tonalità</legend>
            <label>
              <input type="radio" value="current" x-model="opts.keyMode">
              <span x-text="`Scala scelta (${exploreKeyLabel})`"></span>
            </label>
            <label><input type="radio" value="random" x-model="opts.keyMode"> Casuale</label>
            <div class="sub-options" x-show="opts.keyMode === 'random'">
              <label><input type="checkbox" x-model="opts.majors" :disabled="!opts.minors"> Maggiori</label>
              <label><input type="checkbox" x-model="opts.minors" :disabled="!opts.majors"> Minori (tutte)</label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Aiuti</legend>
            <label><input type="checkbox" x-model="opts.showScale"> Mostra la scala sulla tastiera</label>
          </fieldset>
        </div>
      </aside>

      <main class="main">
        <section class="question" x-show="mode === 'exercise' && question">
          <p class="question-key" x-text="questionKey"></p>
          <p class="question-prompt" x-text="prompt"></p>
          <p class="question-inversion" x-show="promptInversion" x-text="promptInversion"></p>

          <div class="choices" x-show="exercise === 'nameChord'">
            <template x-for="c in question?.choices ?? []" :key="c.id">
              <button class="choice" :class="choiceClasses(c)" @click="chooseAnswer(c)" x-text="choiceLabel(c)"></button>
            </template>
          </div>

          <p class="midi-needed" x-show="EXERCISES[exercise].midi && midiStatus !== 'on'">
            Questo esercizio si fa con la tastiera MIDI: collegala qui sotto.
          </p>

          <p class="feedback" :class="feedback" x-text="feedbackText"></p>

          <div class="question-actions">
            <button class="secondary" x-show="exercise === 'nameChord'" @click="playQuestion()">▶ Ascolta</button>
            <button class="secondary" @click="showSolution()" :disabled="solutionShown || feedback === 'correct'">Mostra soluzione</button>
            <button class="secondary" @click="newQuestion()">Salta →</button>
          </div>
        </section>

        <section class="scale-head" x-show="mode === 'explore'">
          <div>
            <h2 x-text="title"></h2>
            <p class="scale-notes">
              <template x-for="(n, i) in scale" :key="i">
                <span class="note-chip" :class="{ tonic: i === 0 }" x-text="name(n)"></span>
              </template>
            </p>
            <p class="hint" x-show="type === 'melodicMinor'">
              Forma ascendente. In discesa si suona come la minore naturale (anche nel ▶).
            </p>
          </div>
          <button class="play" @click="playScale()">▶ Suona la scala</button>
        </section>

        <section class="chords" x-show="mode === 'explore'">
          <div class="chords-head">
            <h3>Accordi della scala</h3>
            <label class="toggle">
              <input type="checkbox" x-model="arpeggio">
              Arpeggiato
            </label>
          </div>
          <template x-for="row in chordRows" :key="row.size">
            <div class="chord-row">
              <span class="row-label" x-text="row.label"></span>
              <div class="chord-grid">
                <template x-for="c in row.chords" :key="c.degree">
                  <button
                    class="chord"
                    :class="{ active: isSelected(row.size, c.degree), played: isRecognized(row.size, c.degree) }"
                    :title="c.quality.name"
                    @click="toggleChord(row.size, c.degree)">
                    <span class="roman" x-text="c.roman"></span>
                    <span class="chord-name" x-text="chordLabel(c)"></span>
                    <span class="chord-notes" x-text="chordNotes(c)"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>
          <p class="selected-info" :class="{ empty: !selectedChord }">
            <strong x-text="selectedChord && chordLabel(selectedChord)"></strong>
            <span x-text="selectedChord && '· ' + selectedChord.quality.name"></span>
            <button class="link" @click="playSelectedChord()">▶ risuona</button>
          </p>
        </section>

        <section class="keyboard-wrap">
          <div class="midi-bar">
            <div class="midi-connect">
              <button
                class="midi-button"
                :class="midiStatus"
                :disabled="midiStatus !== 'off' && midiStatus !== 'error'"
                @click="connectMidi()">
                <span class="dot"></span>
                <span x-text="midiLabel"></span>
              </button>
              <label class="toggle" x-show="midiStatus === 'on'">
                <input type="checkbox" x-model="midiSound">
                Suono
              </label>
            </div>
            <p class="recognized" x-show="mode === 'explore'" :class="{ miss: recognized && !recognized.chord }" x-text="recognizedText"></p>
          </div>
          <div class="keyboard" role="group" aria-label="Tastiera" :style="`aspect-ratio: ${keyboard.whiteCount} / 4.2`">
            <template x-for="k in keyboard.keys" :key="k.midi">
              <button
                class="key"
                :class="keyClasses(k)"
                :style="keyStyle(k)"
                :aria-label="keyLabel(k) || 'tasto'"
                @pointerdown.prevent="pressKey(k)">
                <span class="key-label" x-text="keyLabel(k)"></span>
              </button>
            </template>
          </div>
          <ul class="legend">
            <li x-show="showScaleHints"><span class="swatch tonic"></span>Tonica</li>
            <li x-show="showScaleHints"><span class="swatch in-scale"></span>Nota della scala</li>
            <li x-show="mode === 'explore' || exercise === 'nameChord' || solutionShown"><span class="swatch in-chord"></span><span x-text="mode === 'explore' ? 'Accordo selezionato' : (exercise === 'nameChord' ? 'Accordo da riconoscere' : 'Soluzione')"></span></li>
            <li x-show="midiStatus === 'on'"><span class="swatch held"></span>Suonato (MIDI)</li>
          </ul>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
